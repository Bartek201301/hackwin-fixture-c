# The HackWin configuration of this project (hackwin.yml).
# Written by `hackwin setup`. The Lead changes it only through a pull request; hooks, CI and
# the Gate always read it from the default branch on GitHub.

schema: 1
cli_version: 0.1.1-pre.2
project:
  default_branch: main
  language: en
  event:
    start: 2026-10-24T09:00:00+02:00
    end: 2026-10-25T15:00:00+02:00
team:
  lead: Bartek201301
  members:
    - name: Solo
      github: Bartek201301
      roles:
        - shared
        - counter
        - todos
        - greeting
      agent: claude
      sessions: 2
commands:
  install: "true"
  check: "true"
  test: ls
  format: "true"
  generate: null
  lockfile_regen: "true"
  smoke: null
paths:
  contracts:
    - src/shared/**
  generated: []
  manifests:
    - package.json
  lockfiles:
    - package-lock.json
  gated:
    migrations: []
    production_config: []
  ledger: null
tasks:
  max_files: 10
gate:
  poll_seconds: 60
  ci_rerun_limit: 1
  repeated_failure_threshold: 2
  heartbeat_stale_seconds: 300
  status_issue_seconds: 120
  ci_timeout_minutes: 20
  step_timeout_minutes: 20
  known_flaky_tests: []
  secret_patterns: []
resolver:
  enabled: false
  model: null
  max_turns: 30
